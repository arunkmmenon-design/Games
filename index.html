<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess — Play locally</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(96vw,680px)}h1{margin:0;font-size:2rem}.muted{color:#9ca3af}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:6px solid #334155;border-radius:9px;overflow:hidden}.sq{border:0;padding:0;display:grid;place-items:center;position:relative;font-size:clamp(25px,8vw,58px);cursor:pointer}.light{background:#f0d9b5}.dark{background:#b58863}.sq.selected{box-shadow:inset 0 0 0 5px #facc15}.sq.target:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#166534aa}.sq.capture:after{content:"";position:absolute;inset:4px;border:5px solid #166534aa;border-radius:50%}.piece{filter:drop-shadow(0 1px 1px #555);line-height:1}.white{color:#fff;text-shadow:0 1px 2px #333,-1px 0 #333,1px 0 #333}.black{color:#171717}.btn{border:0;border-radius:8px;background:#334155;color:white;padding:10px 14px;font:inherit;cursor:pointer}.btn:hover{background:#475569}.status{font-weight:700}.moves{overflow-wrap:anywhere;line-height:1.7;min-height:2em}.footer{font-size:.88rem;color:#9ca3af;margin-top:12px}@media(max-width:420px){body{padding:10px}.btn{padding:9px 11px}}
</style></head><body><main class="app"><h1>♟ Chess</h1><p class="muted">Two-player chess on one device</p><div class="top"><div><div class="status" id="status">White to move</div><div class="muted" id="detail">Select a piece to see its legal moves.</div></div><div><button class="btn" id="undo">Undo</button> <button class="btn" id="reset">New game</button></div></div><div class="board" id="board" aria-label="Chess board"></div><div class="top"><span class="muted">Tap a piece, then a highlighted square.</span><button class="btn" id="flip">Flip board</button></div><div class="moves" id="moves"></div><div class="footer">Promotion defaults to queen. Castling, en passant, check and checkmate are supported.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(()=>{const game=new Chess(),board=document.getElementById('board'),status=document.getElementById('status'),detail=document.getElementById('detail'),movesEl=document.getElementById('moves');const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};let selected=null,legal=[],flipped=false;
function render(){board.innerHTML='';const data=game.board();for(let ri=0;ri<8;ri++)for(let ci=0;ci<8;ci++){const r=flipped?7-ri:ri,c=flipped?7-ci:ci,sq=String.fromCharCode(97+c)+(8-r),p=data[r][c],el=document.createElement('button');el.className='sq '+((r+c)%2?'dark':'light');if(sq===selected)el.classList.add('selected');const target=legal.find(m=>m.to===sq);if(target)el.classList.add(p?'capture':'target');el.setAttribute('aria-label',sq+(p?' '+(p.color==='w'?'white ':'black ')+p.type:''));if(p){const span=document.createElement('span');span.className='piece '+(p.color==='w'?'white':'black');span.textContent=glyph[p.color+p.type];el.appendChild(span)}el.addEventListener('click',()=>tap(sq));board.appendChild(el)}
let msg=game.isCheckmate()?'Checkmate — '+(game.turn()==='w'?'Black':'White')+' wins!':game.isDraw()?'Draw':(game.turn()==='w'?'White':'Black')+' to move'+(game.in_check()?' — check!':'');status.textContent=msg;detail.textContent=game.game_over()?'Game over':selected?'Legal moves: '+legal.map(m=>m.to).join(', '):'Select a piece to see its legal moves.';const hist=game.history();movesEl.textContent=hist.length?'Moves: '+hist.map((m,i)=>(i%2===0?Math.floor(i/2+1)+'. ':'')+m).join(' '):'No moves yet.'}
function tap(sq){if(game.game_over())return;const target=legal.find(m=>m.to===sq);if(selected&&target){let promo='q';if(target.flags.includes('p')){const choice=prompt('Promote to (q, r, b, n):','q');if(choice&&'qrbn'.includes(choice.toLowerCase()))promo=choice.toLowerCase()}game.move({from:selected,to:sq,promotion:promo});selected=null;legal=[];render();return}const p=game.get(sq);if(p&&p.color===game.turn()){selected=sq;legal=game.moves({square:sq,verbose:true})}else{selected=null;legal=[]}render()}
document.getElementById('undo').onclick=()=>{game.undo();selected=null;legal=[];render()};document.getElementById('reset').onclick=()=>{game.reset();selected=null;legal=[];render()};document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};render()})();
</script></body></html>
